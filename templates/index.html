<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Census Chat Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            display: flex;
            margin-bottom: 16px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.assistant {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        
        .message.assistant .message-content {
            background: #e9ecef;
            color: #333;
            border-radius: 18px 18px 18px 4px;
        }
        
        .message.assistant.off-topic .message-content {
            background: #fff3cd;
            color: #856404;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
            border-radius: 0 0 12px 12px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="text"]:disabled {
            background: #f8f9fa;
            cursor: not-allowed;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .button-reset {
            background: #6c757d;
            padding: 8px 16px;
            font-size: 12px;
        }
        
        .button-reset:hover {
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #667eea;
        }
        
        .loading span {
            animation: bounce 1.4s infinite;
        }
        
        .loading span:nth-child(1) { animation-delay: 0s; }
        .loading span:nth-child(2) { animation-delay: 0.2s; }
        .loading span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); }
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #721c24;
        }
        
        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #0c5460;
            font-size: 13px;
        }
        
        .timestamp {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 US Census Chat Agent</h1>
            <p>Ask questions about US population data and demographics</p>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="info-message">
                👋 Hello! I'm here to answer questions about US Census population data. 
                Try asking me about population statistics, demographics, or census information for specific regions.
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Ask me about US population, demographics, or census data..."
                    autocomplete="off"
                >
                <button id="sendBtn">Send</button>
            </div>
            <div class="controls">
                <button class="button-reset" id="resetBtn">New Conversation</button>
                <div id="turnCounter" style="align-self: center; font-size: 12px; color: #6c757d;"></div>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const resetBtn = document.getElementById('resetBtn');
        const turnCounter = document.getElementById('turnCounter');
        
        let messageCount = 0;
        let isLoading = false;
        
        // Send message on button click
        sendBtn.addEventListener('click', sendMessage);
        
        // Send message on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isLoading) {
                sendMessage();
            }
        });
        
        // Reset conversation
        resetBtn.addEventListener('click', resetConversation);
        
        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message || isLoading) return;
            
            // Display user message
            displayMessage(message, 'user');
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            isLoading = true;
            
            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = `
                <div class="message-content">
                    <div class="loading">
                        <span>●</span><span>●</span><span>●</span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                loadingDiv.remove();
                
                if (!response.ok) {
                    displayMessage(`Error: ${data.message || 'Failed to get response'}`, 'assistant', true);
                } else {
                    const messageClass = data.is_off_topic ? 'off-topic' : '';
                    displayMessage(data.response, 'assistant', false, messageClass);
                    messageCount = data.conversation_turn || messageCount + 1;
                    updateTurnCounter();
                }
                
            } catch (error) {
                loadingDiv.remove();
                displayMessage('Sorry, I encountered an error. Please try again.', 'assistant', true);
                console.error('Error:', error);
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                isLoading = false;
                messageInput.focus();
            }
        }
        
        function displayMessage(text, role, isError = false, customClass = '') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role} ${customClass}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function updateTurnCounter() {
            if (messageCount > 0) {
                turnCounter.textContent = `Turn ${messageCount}`;
            }
        }
        
        async function resetConversation() {
            if (!confirm('Clear conversation history?')) return;
            
            try {
                await fetch('/api/reset', { method: 'POST' });
                chatContainer.innerHTML = `
                    <div class="info-message">
                        👋 Conversation cleared! Feel free to ask new questions about US Census data.
                    </div>
                `;
                messageCount = 0;
                updateTurnCounter();
                messageInput.focus();
            } catch (error) {
                console.error('Error resetting:', error);
                displayMessage('Failed to reset conversation', 'assistant', true);
            }
        }
        
        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
